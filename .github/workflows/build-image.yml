name: Build bot image

# Builds the bot image in CI and publishes it to GHCR, so a deployment pulls a
# ready image instead of building on the host. The cloud host has ~900 MB free
# RAM and no Docker build cache of its own, so an on-host build recompiles
# better-sqlite3 and lottie-frame from source every time and risks the OOM
# killer taking out a co-tenant container.
#
# Deploy is deliberately not automated: `docker compose up -d` against the live
# bot is an outward-facing action that stays with the operator.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer main commit supersedes an in-flight build; the older tag is still
  # valid, it just never gets pulled.
  group: build-bot-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # The bot statically imports the plugin registry from this submodule;
          # without it the image builds but crashes on the first plugin import.
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          # `load: true` keeps the built image in the local daemon for the
          # transfer below. Pulling it back from GHCR instead would need
          # read:packages, which the push credential does not have.
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit cache lives in the Actions cache, so a rebuild after a
          # prompt-only change reuses the expensive apt/pnpm/node-gyp layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The GHCR package is private and the deploy host's registry login cannot
      # read it (org packages need read:packages). Rather than widen that token,
      # ship the image over SSH: the runner already holds the built layers, so
      # this costs one compressed transfer and no registry permission at all.
      - name: Tag the image for transfer
        run: |
          # metadata-action's `sha` tag is already short (7 chars) while
          # GITHUB_SHA is the full 40-char hash, so read the tag back instead of
          # reconstructing it.
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "tagging $image as larkbot:incoming"
          docker tag "$image" larkbot:incoming

      - name: Set up SSH to the deploy host
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.CLOUD_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key from the secret rather than trusting whatever the
          # network answers with on the first connection.
          echo "${{ secrets.CLOUD_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ship the image to the deploy host
        run: |
          docker save larkbot:incoming \
            | gzip -1 \
            | ssh -i ~/.ssh/deploy_key \
                -o IdentitiesOnly=yes \
                -o BatchMode=yes \
                -o ConnectTimeout=20 \
                -p "${{ vars.DEPLOY_SSH_PORT || 22 }}" \
                "${{ vars.DEPLOY_SSH_USER || 'root' }}@${{ vars.DEPLOY_SSH_HOST }}" \
                'gunzip | docker load && docker tag larkbot:incoming larkbot:local && docker image prune -f --filter "until=24h" >/dev/null'

      # Restarting the live bot is outward-facing, so it stays manual: this
      # workflow only guarantees the image is on the host and tagged
      # larkbot:local, which is what deploy/docker-compose.yml expects.
      - name: Note the remaining manual step
        run: |
          echo "::notice::Image loaded on the deploy host as larkbot:local. Run 'cd /opt/larkbot/deploy && docker compose up -d larkbot' there to switch to it."
