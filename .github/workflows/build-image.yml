name: Build bot image

# Builds the bot image in CI and publishes it to GHCR, so a deployment pulls a
# ready image instead of building on the host. The cloud host has ~900 MB free
# RAM and no Docker build cache of its own, so an on-host build recompiles
# better-sqlite3 and lottie-frame from source every time and risks the OOM
# killer taking out a co-tenant container.
#
# Deploy is deliberately not automated: `docker compose up -d` against the live
# bot is an outward-facing action that stays with the operator.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer main commit supersedes an in-flight build; the older tag is still
  # valid, it just never gets pulled.
  group: build-bot-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # The bot statically imports the plugin registry from this submodule;
          # without it the image builds but crashes on the first plugin import.
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit cache lives in the Actions cache, so a rebuild after a
          # prompt-only change reuses the expensive apt/pnpm/node-gyp layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
