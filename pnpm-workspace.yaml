# plugins/ (the LuckyBot-Plugin submodule) is a workspace package so that its
# own dependencies are installed with core; src/ still imports it by relative
# path.
packages:
  - plugins
onlyBuiltDependencies:
  - better-sqlite3
  - bufferutil
  - es5-ext
  - esbuild
  - ffmpeg-static
  - lottie-frame
  - sharp
  - unrs-resolver
  - utf-8-validate
